{% extends 'base.html' %}
{% block title %}Eliminar producto | Cafetería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body">
                <h3 class="card-title text-danger">Confirmar eliminación</h3>
                <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
