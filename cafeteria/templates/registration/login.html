{% extends 'base.html' %}
{% block title %}Iniciar sesión | Cafetería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <h2 class="mb-4">Iniciar sesión</h2>
        {% if form.errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" autofocus
                    required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}"
                    required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-cafe w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
